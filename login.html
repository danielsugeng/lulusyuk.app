<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LulusYuk - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-login">

  <div class="phone-frame">
    <div class="screen">

      <div class="auth-top">
        <img src="logo.svg" alt="LulusYuk Logo" class="logo-icon">
        <h1 class="logo-text"><span class="text-navy">Lulus</span><span class="text-orange">Yuk!</span></h1>
        <p class="tagline">Latihan Hari Ini Untuk Kampus Impian Esok Hari!</p>
      </div>

      <div class="auth-bottom">
        <h2 class="auth-heading">
          <span class="accent">KAMPUS IMPIAN</span><br>
          <span class="plain">MENUNGGUMU!</span>
        </h2>

        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">Alamat Email</label>
            <input type="email" id="loginEmail" placeholder="Masukkan Alamat Email Anda" required>
          </div>

          <div class="field">
            <label for="loginPassword">Kata Sandi</label>
            <input type="password" id="loginPassword" placeholder="Masukkan Kata Sandi Anda" required>
          </div>

          <a href="signup.html" class="switch-link">BELUM PUNYA AKUN?</a>

          <button type="submit" class="btn-primary">LOGIN</button>
        </form>
      </div>

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
