<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LulusYuk - Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2B63">
<link rel="apple-touch-icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-dashboard">

  <div class="phone-frame">
    <div class="screen dashboard-screen">

      <div class="dash-scroll">

        <div class="dash-header">
          <div class="avatar"><img src="logo.svg" alt="Logo" class="avatar-img"></div>
        </div>

        <div class="dash-greeting" style="margin-bottom:18px;">
          <span class="hi">Halo, <span id="userName">Nama</span>!</span>
          <span class="sub">Sudah Siap Masuk <span id="userUniv">(Univ)</span>?</span>
        </div>

        <div class="menu-grid">
          <a href="#" class="menu-item">
            <div class="menu-icon bg-blue">📘</div>
            Latihan
          </a>
          <a href="#" class="menu-item">
            <div class="menu-icon bg-orange">📝</div>
            Tryout
          </a>
          <a href="#" class="menu-item">
            <div class="menu-icon bg-green">📊</div>
            Analisis
          </a>
          <a href="#" class="menu-item">
            <div class="menu-icon bg-lightblue">🕓</div>
            Riwayat
          </a>
        </div>

        <p class="section-title">Statistik Minggu Ini</p>

        <div class="stat-card">
          <span class="label">Total Soal Dikerjakan</span>
          <span class="value">60</span>
        </div>
        <div class="stat-card">
          <span class="label">Akurasi Jawaban</span>
          <span class="value">85%</span>
        </div>

        <p class="section-title" style="margin-top:18px;">Rekomendasi Latihan Soal Hari Ini</p>

        <div class="reco-card">
          <div class="reco-thumb"></div>
          <div class="reco-info">
            <div class="reco-title">Nama Latihan Soal</div>
            <div class="progress-track">
              <div class="progress-fill"></div>
            </div>
          </div>
          <button class="play-btn">▶</button>
        </div>

        <div class="upgrade-banner">
          <span class="txt">AKSES RIWAYAT TAK<br>TERBATAS SEKARANG!</span>
          <button class="upgrade-btn">UPGRADE</button>
        </div>

      </div>

      <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">
          <span class="nav-icon">🏠</span>
          Home
        </a>
        <a href="#" class="nav-item">
          <span class="nav-icon">📘</span>
          Latihan
        </a>
        <a href="#" class="nav-item">
          <span class="nav-icon">📊</span>
          Analisis
        </a>
        <a href="#" class="nav-item">
          <span class="nav-icon">👤</span>
          Profil
        </a>
      </div>

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
