<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LulusYuk - Profil</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2B63">
<link rel="apple-touch-icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-profil">

  <div class="phone-frame">
    <div class="screen dashboard-screen">

      <div class="dash-scroll">

        <div class="profil-foto">
          <img id="profilFoto" src="profil-kosong.svg" alt="Foto profil">
        </div>

        <h2 id="profilNama" class="profil-nama">Nama User</h2>
        <p id="profilUniv" class="profil-univ">Target Universitas</p>
        <p id="profilJurusan" class="profil-jurusan">Target Jurusan</p>

        <div class="profil-stats">
          <div class="profil-stat">
            <span class="profil-stat-label">Soal Dijawab</span>
            <span id="statSoal" class="profil-stat-value">0</span>
          </div>
          <div class="profil-stat">
            <span class="profil-stat-label">Tryout Selesai</span>
            <span id="statTryout" class="profil-stat-value">0</span>
          </div>
        </div>

        <a href="#" id="btnEdit" class="menu-btn">
          <span class="menu-btn-left">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Edit Profil
          </span>
          <span class="menu-btn-arrow">▶</span>
        </a>

        <button type="button" id="btnLogout" class="menu-btn menu-btn-logout">
          <span class="menu-btn-left">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Logout
          </span>
          <span class="menu-btn-arrow">▶</span>
        </button>

      </div>

      <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
          <span class="nav-icon">🏠</span>
          Home
        </a>
        <a href="latihan.html" class="nav-item">
          <span class="nav-icon">📘</span>
          Latihan
        </a>
        <a href="analisis.html" class="nav-item">
          <span class="nav-icon">📊</span>
          Analisis
        </a>
        <a href="profil.html" class="nav-item active">
          <span class="nav-icon">👤</span>
          Profil
        </a>
      </div>

    </div>
  </div>

<script src="script.js"></script>
<script src="profil.js"></script>
</body>
</html>
