<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LulusYuk - Sign Up</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-signup">

  <div class="phone-frame">
    <div class="screen">

      <div class="auth-top">
        <img src="logo.svg" alt="LulusYuk Logo" class="logo-icon">
        <h1 class="logo-text"><span class="text-navy">Lulus</span><span class="text-orange">Yuk!</span></h1>
        <p class="tagline">Latihan Hari Ini Untuk Kampus Impian Esok Hari!</p>
      </div>

      <div class="auth-bottom">
        <h2 class="auth-heading">
          <span class="plain">SEBELUM LULUS,</span><br>
          <span class="accent">KENALAN YUK!</span>
        </h2>

        <form id="signupForm">
          <div class="field">
            <label for="signupName">Nama Lengkap</label>
            <input type="text" id="signupName" placeholder="Masukkan Nama Lengkap Anda" required>
          </div>

          <div class="field">
            <label for="signupEmail">Alamat Email</label>
            <input type="email" id="signupEmail" placeholder="Masukkan Alamat Email Anda" required>
          </div>

          <div class="field">
            <label for="signupPassword">Kata Sandi</label>
            <input type="password" id="signupPassword" placeholder="Masukkan Kata Sandi Anda" required>
          </div>

          <a href="login.html" class="switch-link">SUDAH PUNYA AKUN?</a>

          <button type="submit" class="btn-primary">SIGN UP</button>
        </form>
      </div>

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
