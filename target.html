<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LulusYuk - Target Kampus</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F2B63">
<link rel="apple-touch-icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="page-target">

  <div class="phone-frame">
    <div class="screen target-screen">

      <div class="target-card">
        <div class="target-logo">
          <img src="logo.svg" alt="LulusYuk Logo" class="logo-icon">
          <h1 class="logo-text"><span class="text-navy">Lulus</span><span class="text-orange">Yuk!</span></h1>
        </div>

        <h2 class="target-title">TARGET KAMU<br>KULIAH DI MANA?</h2>

        <form id="targetForm">
          <div class="field">
            <label for="targetUniv">Target Perguruan Tinggi</label>
            <input type="text" id="targetUniv" placeholder="Masukkan Nama Perguruan Tinggi" required>
          </div>

          <div class="field">
            <label for="targetJurusan">Target Jurusan</label>
            <input type="text" id="targetJurusan" placeholder="Masukkan Nama Jurusan" required>
          </div>

          <button type="submit" class="btn-primary">MULAI!</button>
        </form>
      </div>

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
